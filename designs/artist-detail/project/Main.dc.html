<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LynMusic · 陈升</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}*{box-sizing:border-box}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #E03131;outline-offset:4px}a{color:inherit;text-decoration:none}a:hover{color:#E03131}button:hover{filter:brightness(.97)}button:disabled{cursor:default}svg{flex-shrink:0}button svg{pointer-events:none}input::placeholder{color:#76716F}
    @media(max-width:760px){.sidebar{flex-basis:100%!important;padding:20px!important;border-right:0!important;border-bottom:1px solid #EEE!important}.side-menu{flex-direction:row!important;flex-wrap:wrap!important}.side-footer{display:none!important}.main-pane{padding:24px 20px 130px!important}.portrait{width:140px!important;height:140px!important}.artist-name{font-size:48px!important}.album-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.track-album{display:none!important}.track-grid{grid-template-columns:minmax(0,1fr) 46px 44px 44px!important}.player{left:16px!important;right:16px!important;gap:16px!important}.player-extra,.player-timeline{display:none!important}.player-track{min-width:0!important;flex:1!important}.hero{gap:24px!important}.hero-actions{gap:8px!important}}
  </style>
</helmet>
<div style="display:flex;flex-wrap:wrap;min-height:1140px;background:#FFFFFF;color:#111111;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-size:14px;line-height:1.5">
  <aside class="sidebar" style="flex:0 1 216px;display:flex;flex-direction:column;gap:40px;padding:40px 20px 32px;border-right:1px solid #EBE8E6;background:#FBFAF9">
    <a href="#artist" style="display:flex;align-items:center;gap:10px;padding:0 10px;min-height:44px" aria-label="LynMusic 歌手详情">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E03131" stroke-width="1.8" aria-hidden="true"><path d="M4 5v14a1 1 0 0 0 1 1h14" stroke-linecap="round"></path><rect x="8" y="2" width="14" height="14" rx="3" fill="#E03131" stroke="none"></rect><path d="M16 6v5.5m0-5.5h3" stroke="white" stroke-linecap="round"></path><circle cx="14.5" cy="11.5" r="2" fill="white" stroke="none"></circle></svg>
      <span style="font-size:23px;font-weight:760;letter-spacing:-1px">LynMusic</span>
    </a>
    <nav class="side-menu" aria-label="主导航" style="display:flex;flex-direction:column;gap:8px">
      <button type="button" style="display:flex;align-items:center;gap:13px;min-height:48px;padding:12px 16px;border:0;background:transparent;color:#4A4541;text-align:left"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke-linecap="round"></path></svg>我的</button>
      <a href="#artist" aria-current="page" style="display:flex;align-items:center;gap:13px;min-height:48px;padding:12px 16px;border-radius:14px;background:#FBE8E8;color:#C02626;font-weight:650"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6v14h14" stroke-linecap="round" stroke-linejoin="round"></path><rect x="7" y="2" width="14" height="14" rx="3"></rect><path d="M15 6v5m0-5h3" stroke-linecap="round"></path><circle cx="13.5" cy="11.5" r="1.7"></circle></svg>曲库</a>
      <button type="button" style="display:flex;align-items:center;gap:13px;min-height:48px;padding:12px 16px;border:0;background:transparent;color:#4A4541;text-align:left"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" stroke-linejoin="round"></path></svg>喜欢</button>
      <button type="button" style="display:flex;align-items:center;gap:13px;min-height:48px;padding:12px 16px;border:0;background:transparent;color:#4A4541;text-align:left"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13" stroke-linecap="round"></path><circle cx="3" cy="6" r="1" fill="currentColor"></circle><circle cx="3" cy="12" r="1" fill="currentColor"></circle><circle cx="3" cy="18" r="1" fill="currentColor"></circle></svg>歌单</button>
      <button type="button" style="display:flex;align-items:center;gap:13px;min-height:48px;padding:12px 16px;border:0;background:transparent;color:#4A4541;text-align:left"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 7h7l2 2h9v11H3V7Zm0 0V4h7l2 3" stroke-linejoin="round"></path></svg>来源</button>
    </nav>
    <div class="side-footer" style="margin-top:auto;display:flex;flex-direction:column;gap:18px;padding:0 10px">
      <div style="height:1px;background:#E9E6E4"></div>
      <button type="button" style="display:flex;align-items:center;gap:12px;min-height:44px;border:0;background:transparent;color:#4A4541;text-align:left"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3m0 16v3M1 12h3m16 0h3" stroke-linecap="round"></path></svg>设置</button>
    </div>
  </aside>
  <main class="main-pane" style="flex:999 1 600px;min-width:0;padding:30px 48px 150px">
    <div style="max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px">
      <header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;min-height:44px">
        <div style="display:flex;align-items:center;gap:16px;color:#645F5B;font-size:13px"><a href="#artist" style="display:flex;align-items:center;gap:8px;min-height:44px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"></path></svg>歌手</a><span style="color:#C8C2BF">/</span><span style="color:#111111">陈升</span></div>
        <span style="font-size:11px;letter-spacing:1px;color:#645F5B;border:1px solid #E6E2DF;border-radius:6px;padding:5px 9px">示例曲库</span>
      </header>
      <section class="hero" id="artist" aria-label="歌手信息" style="display:flex;flex-wrap:wrap;align-items:center;gap:40px;padding:12px 0 34px">
        <img class="portrait" src="/_blob/352b8783c64fdfafa0ec3031cdbd59e6" alt="陈升肖像" style="display:block;width:212px;height:212px;border-radius:50%;object-fit:cover;object-position:center 21%;filter:grayscale(1)">
        <div style="flex:1;min-width:250px;display:flex;flex-direction:column;align-items:flex-start;gap:14px">
          <span style="font-size:12px;font-weight:600;color:#645F5B;letter-spacing:2px">歌手</span>
          <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap"><h1 class="artist-name" style="font-size:64px;line-height:1.1;font-weight:750;letter-spacing:-2px;margin:0">陈升</h1><span style="font-size:20px;letter-spacing:.2px;color:#76716F">Bobby Chen</span></div>
          <p style="margin:0;color:#645F5B;font-size:14px">6 首歌曲<span style="padding:0 12px;color:#C8C2BF">·</span>4 张专辑</p>
          <div class="hero-actions" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:9px">
            <button type="button" onClick="{{playAll}}" style="display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 25px;border:0;border-radius:24px;background:{{accent}};color:white;font-weight:650">
              <sc-if value="{{isPlaying}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if>
              <sc-if value="{{isPaused}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.8a1 1 0 0 1 1.5-.85l12 7.2a1 1 0 0 1 0 1.7l-12 7.2a1 1 0 0 1-1.5-.85Z"></path></svg></sc-if>
              {{playLabel}}
            </button>
            <button type="button" onClick="{{shuffle}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:1px solid #E3DEDB;border-radius:24px;background:#FFFFFF;color:#111111;font-weight:550"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h2c5 0 9 12 14 12h2m-4-4 4 4-4 4M3 18h2c2 0 4-2 6-6s6-6 8-6h2m-4-4 4 4-4 4" stroke-linecap="round" stroke-linejoin="round"></path></svg>随机播放</button>
            <button type="button" onClick="{{toggleArtist}}" aria-pressed="{{artistLiked}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 19px;border:1px solid #E3DEDB;border-radius:24px;background:white;color:{{artistColor}};font-weight:550"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{artistFill}}" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" stroke-linejoin="round"></path></svg>{{artistLabel}}</button>
          </div>
        </div>
      </section>
      <nav aria-label="歌手内容" style="display:flex;align-items:center;gap:30px;border-bottom:1px solid #EAE6E3;margin-top:-15px">
        <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3"><button type="button" onClick="{{tab.pick}}" aria-pressed="{{tab.selected}}" style="min-height:51px;padding:0 2px;border:0;border-bottom:2px solid {{tab.line}};background:transparent;color:{{tab.color}};font-size:15px;font-weight:{{tab.weight}}">{{tab.label}}</button></sc-for>
      </nav>
      <sc-if value="{{showAlbums}}" hint-placeholder-val="{{true}}">
        <section aria-label="专辑" style="display:flex;flex-direction:column;gap:19px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px"><h2 style="font-size:21px;letter-spacing:-.5px;font-weight:700;margin:0">专辑<span style="font-size:13px;font-weight:450;color:#76716F;padding-left:10px">4</span></h2><button type="button" onClick="{{reverseAlbums}}" style="display:flex;align-items:center;gap:7px;min-height:44px;border:0;background:transparent;color:#645F5B;font-size:12px">{{albumSortLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
          <div class="album-grid" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px">
            <sc-for list="{{albums}}" as="album" hint-placeholder-count="4">
              <button type="button" onClick="{{album.open}}" style="display:flex;flex-direction:column;gap:13px;align-items:stretch;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:#111111" aria-label="{{album.aria}}"><img src="{{album.cover}}" alt="{{album.alt}}" style="display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;box-shadow:0 4px 12px #1111110D"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:15px;font-weight:650">{{album.title}}</span><span style="font-size:12px;color:#76716F">{{album.year}} · 专辑</span></div></button>
            </sc-for>
          </div>
        </section>
      </sc-if>
      <sc-if value="{{showSongs}}" hint-placeholder-val="{{true}}">
        <section id="songs" aria-label="歌曲" style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:56px">
            <div style="display:flex;align-items:center;gap:12px"><h2 style="font-size:21px;font-weight:700;letter-spacing:-.5px;margin:0">{{songHeading}}</h2><span style="font-size:13px;color:#76716F">{{resultCount}}</span><sc-if value="{{hasAlbumFilter}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clearAlbum}}" style="min-height:44px;border:0;background:transparent;color:#C02626;font-size:12px">全部歌曲</button></sc-if></div>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><label style="display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;background:#F6F5F4;border-radius:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#76716F" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4" stroke-linecap="round"></path></svg><input value="{{query}}" onChange="{{search}}" aria-label="搜索此歌手的歌曲" placeholder="搜索歌曲" style="width:140px;min-width:0;border:0;outline-offset:8px;background:transparent;color:#111111;font-size:12px"></label><label style="display:flex;align-items:center;gap:5px;color:#645F5B"><span style="font-size:12px">排序</span><select aria-label="歌曲排序" value="{{sort}}" onChange="{{changeSort}}" style="min-height:44px;border:0;background:transparent;color:#645F5B;font-size:12px"><option value="default">默认顺序</option><option value="name">歌曲名称</option></select></label></div>
          </div>
          <div class="track-grid" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.62fr) 56px 44px 44px;align-items:center;gap:10px;padding:4px 10px 10px;border-bottom:1px solid #EBE8E6;color:#76716F;font-size:11px"><span style="padding-left:36px">歌曲</span><span class="track-album">专辑</span><span style="text-align:right">时长</span><span></span><span></span></div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <sc-for list="{{songs}}" as="song" hint-placeholder-count="6">
              <div class="track-grid" style="position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.62fr) 56px 44px 44px;align-items:center;gap:10px;min-height:64px;padding:5px 10px;border-radius:10px;background:{{song.background}}">
                <button type="button" onClick="{{song.play}}" aria-label="{{song.playAria}}" style="display:grid;grid-template-columns:26px 42px minmax(0,1fr);gap:12px;align-items:center;min-width:0;min-height:50px;padding:0;border:0;background:transparent;text-align:left;color:{{song.color}}"><span style="text-align:center;font-size:12px;font-variant-numeric:tabular-nums">{{song.indexLabel}}</span><img src="{{song.cover}}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:6px"><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:550">{{song.title}}</span><span style="font-size:11px;color:#76716F">陈升</span></span></button>
                <button class="track-album" type="button" onClick="{{song.openAlbum}}" style="min-height:44px;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:#645F5B;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{song.album}}</button>
                <span style="text-align:right;color:#76716F;font-size:12px;font-variant-numeric:tabular-nums">{{song.duration}}</span>
                <button type="button" onClick="{{song.like}}" aria-label="{{song.likeAria}}" aria-pressed="{{song.liked}}" style="display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:{{song.likeColor}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="{{song.likeFill}}" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" stroke-linejoin="round"></path></svg></button>
                <button type="button" onClick="{{song.more}}" aria-label="{{song.moreAria}}" aria-expanded="{{song.menuOpen}}" style="display:grid;place-items:center;width:44px;height:44px;border:0;background:transparent;color:#76716F"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></button>
                <sc-if value="{{song.menuOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;right:12px;top:56px;z-index:10;display:flex;flex-direction:column;width:190px;padding:6px;border:1px solid #E8E3E0;border-radius:12px;background:#FFFFFF;box-shadow:0 8px 28px #11111118"><button type="button" onClick="{{song.playNext}}" style="min-height:44px;padding:0 12px;border:0;border-radius:7px;background:transparent;text-align:left;color:#111111">下一首播放</button><button type="button" onClick="{{song.openAlbum}}" style="min-height:44px;padding:0 12px;border:0;border-radius:7px;background:transparent;text-align:left;color:#111111">查看专辑</button><button type="button" onClick="{{closeMenu}}" style="min-height:44px;padding:0 12px;border:0;border-top:1px solid #EEE;background:transparent;text-align:left;color:#76716F">关闭</button></div></sc-if>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}"><div style="padding:40px 20px;text-align:center;color:#645F5B">没有匹配的歌曲<button type="button" onClick="{{clearSearch}}" style="display:block;min-height:44px;margin:8px auto 0;padding:0 20px;border:0;border-radius:24px;background:#FBE8E8;color:#C02626">清除搜索</button></div></sc-if>
        </section>
      </sc-if>
    </div>
  </main>
  <section class="player" aria-label="迷你播放器" style="position:fixed;left:240px;right:24px;bottom:24px;z-index:20;display:flex;align-items:center;gap:28px;min-height:90px;padding:16px 22px;background:#FFFFFF;border:1px solid #E5DFDC;border-radius:22px;box-shadow:0 10px 40px #28201B12">
    <div class="player-track" style="display:flex;align-items:center;gap:13px;min-width:230px;flex:1"><img src="{{current.cover}}" alt="{{current.alt}}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:5px;min-width:0"><span style="font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{current.title}}</span><span style="color:#76716F;font-size:12px">陈升</span></div></div>
    <div style="display:flex;align-items:center;gap:10px"><button type="button" onClick="{{previous}}" aria-label="上一首" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#111111"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="5" width="2" height="14" rx="1"></rect><path d="m19 5-11 7 11 7Z"></path></svg></button><button type="button" onClick="{{togglePlay}}" aria-label="{{playerPlayAria}}" style="display:grid;place-items:center;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:{{accent}};color:white"><sc-if value="{{isPlaying}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if><sc-if value="{{isPaused}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 13 8-13 8Z"></path></svg></sc-if></button><button type="button" onClick="{{next}}" aria-label="下一首" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#111111"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="18" y="5" width="2" height="14" rx="1"></rect><path d="m5 5 11 7-11 7Z"></path></svg></button></div>
    <div class="player-timeline" style="display:flex;align-items:center;gap:10px;flex:1;max-width:300px"><span style="font-size:10px;color:#76716F;font-variant-numeric:tabular-nums">{{elapsed}}</span><input type="range" aria-label="播放进度" min="0" max="100" value="{{progress}}" onChange="{{seek}}" style="width:100%;min-width:40px;min-height:44px;accent-color:{{accent}}"><span style="font-size:10px;color:#76716F;font-variant-numeric:tabular-nums">{{current.duration}}</span></div>
    <button type="button" onClick="{{toggleQueue}}" aria-label="播放队列" aria-expanded="{{queueOpen}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0;border:0;background:transparent;color:#645F5B"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5h15M3 11h10M3 17h8m7-6v9m0-9h4" stroke-linecap="round"></path><circle cx="16" cy="20" r="2"></circle></svg><span class="player-extra" style="font-size:12px">6</span></button>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E03131","options":["#E03131","#BD2424","#A82020"]},"$preview":{"width":1440,"height":1520}}'>
class Component extends DCLogic {
  state = { tab:'overview', artistLiked:false, liked:[0,2], active:0, playing:false, query:'', sort:'default', albumFilter:null, reverse:false, menu:null, queueOpen:false, nextTrack:null, progress:0, notice:'' };
  renderVals() {
    const s=this.state, accent=this.props.accent??'#E03131';
    const albums=[{id:'home',title:'归乡',year:'2017',cover:'/_blob/da6f006198cf2ce5544e3459ea6c8ca0'},{id:'encounter',title:'美丽的邂逅',year:'2008',cover:'/_blob/ee7522952e6383bdd4a9507cd1342bc5'},{id:'kite',title:'风筝',year:'1994',cover:'/_blob/563f0472c03e8c5da269db0f136c6e72'},{id:'runaway',title:'私奔',year:'1991',cover:'/_blob/cabf4716b096374de50ba02145ce0fdf'}];
    const raw=[{title:'把悲伤留给自己',albumId:'runaway',seconds:271},{title:'风筝',albumId:'kite',seconds:283},{title:'牡丹亭外',albumId:'encounter',seconds:318},{title:'归乡',albumId:'home',seconds:319},{title:'20岁的眼泪',albumId:'kite',seconds:323},{title:'我喜欢私奔和我自己',albumId:'runaway',seconds:317}];
    const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
    const openAlbum=id=>this.setState({tab:'songs',albumFilter:id,query:'',menu:null});
    const all=raw.map((t,i)=>{const a=albums.find(a=>a.id===t.albumId),liked=s.liked.includes(i);return {...t,id:i,album:a.title,cover:a.cover,alt:a.title+'专辑封面',duration:fmt(t.seconds),indexLabel:i===s.active&&s.playing?'Ⅱ':String(i+1).padStart(2,'0'),background:i===s.active?'#FCF0EF':'transparent',color:i===s.active?'#C02626':'#111111',liked,likeColor:liked?'#C02626':'#76716F',likeFill:liked?'currentColor':'none',playAria:'播放'+t.title,likeAria:(liked?'取消喜欢':'喜欢')+t.title,moreAria:t.title+'的更多操作',menuOpen:s.menu===i,play:()=>this.setState({active:i,playing:true,progress:0,queueOpen:false}),like:()=>this.setState({liked:liked?s.liked.filter(x=>x!==i):[...s.liked,i]}),openAlbum:()=>openAlbum(t.albumId),more:()=>this.setState({menu:s.menu===i?null:i}),playNext:()=>this.setState({nextTrack:i,menu:null,notice:'下一首将播放《'+t.title+'》'})};});
    let songs=all.filter(t=>(!s.albumFilter||t.albumId===s.albumFilter)&&t.title.includes(s.query.trim()));
    if(s.sort==='name')songs.sort((a,b)=>a.title.localeCompare(b.title,'zh-CN'));

    return {accent,albums:(s.reverse?[...albums].reverse():albums).map(a=>({...a,alt:a.title+'专辑封面',aria:'查看'+a.title+'中的歌曲',open:()=>openAlbum(a.id)})),songs,current,
      tabs:[{id:'overview',label:'概览'},{id:'songs',label:'歌曲  6'},{id:'albums',label:'专辑  4'}].map(t=>({...t,selected:s.tab===t.id,color:s.tab===t.id?'#C02626':'#645F5B',line:s.tab===t.id?accent:'transparent',weight:s.tab===t.id?650:450,pick:()=>pickTab(t.id)})),
      showAlbums:s.tab!=='songs',showSongs:s.tab!=='albums',songHeading:filterAlbum?filterAlbum.title:'歌曲',resultCount:songs.length+' 首',hasAlbumFilter:!!filterAlbum,isEmpty:songs.length===0,clearAlbum:()=>this.setState({albumFilter:null,query:''}),

      isPlaying:s.playing,isPaused:!s.playing,playLabel:s.playing?'暂停播放':'播放全部',playerPlayAria:s.playing?'暂停':'播放',playAll:()=>this.setState({playing:!s.playing}),togglePlay:()=>this.setState({playing:!s.playing}),shuffle:()=>this.setState({active:(s.active+1+Math.floor(Math.random()*5))%6,playing:true,progress:0,notice:'随机播放已开启'}),

      query:s.query,search:e=>this.setState({query:e.target.value}),clearSearch:()=>this.setState({query:''}),sort:s.sort,changeSort:e=>this.setState({sort:e.target.value}),albumSortLabel:s.reverse?'发行时间：从早到晚':'发行时间：从晚到早',reverseAlbums:()=>this.setState({reverse:!s.reverse}),closeMenu:()=>this.setState({menu:null}),

  }
}
</script>
