<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LynMusic · 手机歌手详情</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0}*{box-sizing:border-box}button,input,select{font:inherit}button{cursor:pointer}button,a,input{-webkit-tap-highlight-color:transparent}button:hover{filter:brightness(.97)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #E03131;outline-offset:3px}a{color:inherit;text-decoration:none}a:hover{color:#E03131}svg{flex-shrink:0}button svg{pointer-events:none}input::placeholder{color:#76716F}

</helmet>
<div style="min-height:844px;background:#FFFFFF;color:#111111;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;font-size:14px;line-height:1.5">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:8px 16px">
    <a href="#artist" aria-label="返回歌手信息" style="display:flex;align-items:center;gap:4px;min-height:44px;padding:0 4px;color:#4A4541"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size:14px">歌手</span></a>
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:10px;color:#76716F;letter-spacing:.5px">示例曲库</span><button type="button" onClick="{{toggleSearch}}" aria-label="搜索歌曲" aria-expanded="{{searchOpen}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#111111"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5" stroke-linecap="round"></path></svg></button></div>
  </header>
  <main style="display:flex;flex-direction:column;gap:20px;padding:10px 20px 170px">
    <section id="artist" aria-label="歌手信息" style="display:flex;align-items:center;gap:22px;padding:4px 0 0">
      <img src="/_blob/352b8783c64fdfafa0ec3031cdbd59e6" alt="陈升肖像" style="display:block;width:108px;height:108px;border-radius:50%;object-fit:cover;object-position:center 21%;filter:grayscale(1)">
      <div style="display:flex;flex-direction:column;gap:5px;min-width:0"><h1 style="margin:0;font-size:40px;font-weight:750;line-height:1.2;letter-spacing:-1px">陈升</h1><span style="font-size:14px;color:#76716F;letter-spacing:.25px">Bobby Chen</span><p style="margin:5px 0 0;font-size:11px;color:#645F5B;white-space:nowrap">6 首歌曲<span style="padding:0 8px;color:#B9B1AC">·</span>4 张专辑</p></div>
    </section>
    <div style="display:grid;grid-template-columns:1fr 1fr 44px;align-items:center;gap:10px;margin-top:2px">
      <button type="button" onClick="{{togglePlay}}" style="display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 9px;border:0;border-radius:24px;background:{{accent}};color:#FFFFFF;font-size:13px;font-weight:650"><sc-if value="{{isPlaying}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if><sc-if value="{{isPaused}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 13 8-13 8Z"></path></svg></sc-if>{{playLabel}}</button>
      <button type="button" onClick="{{shuffle}}" style="display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 9px;border:1px solid #E3DEDB;border-radius:24px;background:#FFFFFF;color:#111111;font-size:13px;font-weight:550"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h2c5 0 9 12 14 12h2m-4-4 4 4-4 4M3 18h2c2 0 4-2 6-6s6-6 8-6h2m-4-4 4 4-4 4" stroke-linecap="round" stroke-linejoin="round"></path></svg>随机播放</button>
      <button type="button" onClick="{{toggleArtist}}" aria-label="{{artistLabel}}" aria-pressed="{{artistLiked}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #E3DEDB;border-radius:50%;background:#FFFFFF;color:{{artistColor}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="{{artistFill}}" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" stroke-linejoin="round"></path></svg></button>
    </div>
    <nav aria-label="歌手内容" style="display:flex;align-items:center;gap:26px;border-bottom:1px solid #EAE6E3">

    </nav>
    <sc-if value="{{searchOpen}}" hint-placeholder-val="{{false}}"><label style="display:flex;align-items:center;gap:10px;min-height:44px;padding:0 13px;background:#F6F5F4;border-radius:10px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#76716F" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4" stroke-linecap="round"></path></svg><input value="{{query}}" onChange="{{search}}" aria-label="搜索此歌手的歌曲" placeholder="搜索陈升的歌曲" style="flex:1;min-width:0;min-height:44px;border:0;background:transparent;color:#111111;font-size:13px"></label></sc-if>
    <sc-if value="{{showAlbums}}" hint-placeholder-val="{{true}}">
      <section aria-label="专辑" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 style="margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px">专辑<span style="padding-left:8px;font-size:12px;font-weight:450;color:#76716F">4</span></h2><button type="button" onClick="{{reverseAlbums}}" style="display:flex;align-items:center;gap:5px;min-height:44px;padding:0;border:0;background:transparent;color:#76716F;font-size:11px">{{albumSortLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
        <div style="display:flex;gap:16px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding-bottom:6px">

      <section aria-label="歌曲" style="display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px"><div style="display:flex;align-items:center;gap:8px"><h2 style="margin:0;font-size:19px;font-weight:700;letter-spacing:-.5px">{{songHeading}}</h2><span style="font-size:12px;color:#76716F">{{resultCount}}</span></div><sc-if value="{{hasAlbumFilter}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{clearAlbum}}" style="min-height:44px;padding:0;border:0;background:transparent;color:#C02626;font-size:12px">全部歌曲</button></sc-if><sc-if value="{{noAlbumFilter}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{toggleSort}}" style="display:flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;background:transparent;color:#76716F;font-size:11px">{{songSortLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h6" stroke-linecap="round"></path></svg></button></sc-if></div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <sc-for list="{{songs}}" as="song" hint-placeholder-count="6">
            <div style="position:relative;display:flex;align-items:center;gap:7px;min-height:63px;margin:0 -8px;padding:5px 3px 5px 8px;border-radius:10px;background:{{song.background}}">
              <button type="button" onClick="{{song.play}}" aria-label="{{song.playAria}}" style="flex:1;min-width:0;display:flex;align-items:center;gap:11px;min-height:48px;padding:0;border:0;background:transparent;color:{{song.color}};text-align:left"><img src="{{song.cover}}" alt="" style="width:42px;height:42px;object-fit:cover;border-radius:6px"><span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{song.title}}</span><span style="font-size:10px;color:#76716F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{song.album}}<span style="padding:0 6px">·</span>{{song.duration}}</span></span></button>
              <button type="button" onClick="{{song.like}}" aria-label="{{song.likeAria}}" aria-pressed="{{song.liked}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:{{song.likeColor}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="{{song.likeFill}}" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z" stroke-linejoin="round"></path></svg></button>
              <button type="button" onClick="{{song.more}}" aria-label="{{song.moreAria}}" aria-expanded="{{song.menuOpen}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#76716F"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg></button>
              <sc-if value="{{song.menuOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;right:8px;top:57px;z-index:10;display:flex;flex-direction:column;width:184px;padding:6px;border:1px solid #E8E3E0;border-radius:12px;background:#FFFFFF;box-shadow:0 8px 28px #11111118"><button type="button" onClick="{{song.playNext}}" style="min-height:44px;padding:0 12px;border:0;background:transparent;text-align:left;color:#111111;font-size:13px">下一首播放</button><button type="button" onClick="{{song.openAlbum}}" style="min-height:44px;padding:0 12px;border:0;background:transparent;text-align:left;color:#111111;font-size:13px">查看专辑</button><button type="button" onClick="{{closeMenu}}" style="min-height:44px;padding:0 12px;border:0;border-top:1px solid #EEE;background:transparent;text-align:left;color:#76716F;font-size:13px">关闭</button></div></sc-if>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}"><div style="padding:32px 16px;text-align:center;color:#645F5B;font-size:13px">没有匹配的歌曲<button type="button" onClick="{{clearSearch}}" style="display:block;min-height:44px;margin:8px auto 0;padding:0 18px;border:0;border-radius:22px;background:#FBE8E8;color:#C02626">清除搜索</button></div></sc-if>
      </section>
    </sc-if>
  </main>
  <section aria-label="迷你播放器" style="position:fixed;left:12px;right:12px;bottom:78px;z-index:20;display:flex;align-items:center;gap:10px;min-height:70px;padding:10px 8px 10px 12px;border:1px solid #E5DFDC;border-radius:18px;background:#FFFFFF;box-shadow:0 6px 28px #28201B12">
    <img src="{{current.cover}}" alt="{{current.alt}}" style="width:44px;height:44px;border-radius:7px;object-fit:cover">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{current.title}}</span><span style="font-size:10px;color:#76716F">陈升</span></div>
    <button type="button" onClick="{{togglePlay}}" aria-label="{{playerPlayAria}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:{{accent}};color:white"><sc-if value="{{isPlaying}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></sc-if><sc-if value="{{isPaused}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 4 13 8-13 8Z"></path></svg></sc-if></button>
    <button type="button" onClick="{{toggleQueue}}" aria-label="播放队列" aria-expanded="{{queueOpen}}" style="display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#645F5B"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 5h15M3 11h10M3 17h8m7-6v9m0-9h4" stroke-linecap="round"></path><circle cx="16" cy="20" r="2"></circle></svg></button>
    <sc-if value="{{queueOpen}}" hint-placeholder-val="{{false}}"><div style="position:absolute;left:0;right:0;bottom:82px;display:flex;flex-direction:column;gap:3px;padding:16px;border:1px solid #E5DFDC;border-radius:18px;background:#FFFFFF;box-shadow:0 8px 32px #11111118"><div style="display:flex;align-items:center;justify-content:space-between"><strong style="font-size:17px">播放队列<span style="padding-left:8px;font-size:12px;font-weight:450;color:#76716F">6 首</span></strong><button type="button" onClick="{{toggleQueue}}" aria-label="关闭播放队列" style="width:44px;height:44px;border:0;background:transparent;color:#645F5B;font-size:22px">×</button></div><sc-for list="{{queueSongs}}" as="queued" hint-placeholder-count="6"><button type="button" onClick="{{queued.play}}" style="display:flex;align-items:center;gap:12px;min-height:48px;padding:5px 0;border:0;background:transparent;color:{{queued.color}};text-align:left"><img src="{{queued.cover}}" alt="" style="width:34px;height:34px;border-radius:5px"><span style="font-size:12px">{{queued.title}}</span></button></sc-for><button type="button" onClick="{{next}}" style="min-height:44px;margin-top:8px;border:0;border-radius:22px;background:#FBE8E8;color:#C02626;font-size:13px">下一首</button></div></sc-if>
  </section>
  <nav aria-label="主导航" style="position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-height:66px;padding:6px 20px 8px;border-top:1px solid #EFECEA;background:#FFFFFF">
    <a href="#artist" aria-current="page" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;color:#C02626"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6v14h14" stroke-linecap="round" stroke-linejoin="round"></path><rect x="7" y="2" width="14" height="14" rx="3"></rect><path d="M15 6v5m0-5h3" stroke-linecap="round"></path><circle cx="13.5" cy="11.5" r="1.7"></circle></svg><span style="font-size:10px;font-weight:600">曲库</span></a>
    <button type="button" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;padding:0;border:0;background:transparent;color:#645F5B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2" stroke-linecap="round"></path></svg><span style="font-size:10px">我的</span></button>
    <button type="button" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;padding:0;border:0;background:transparent;color:#645F5B"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg><span style="font-size:10px">更多</span></button>
  </nav>
  <sc-if value="{{hasNotice}}" hint-placeholder-val="{{false}}"><div role="status" style="position:fixed;left:20px;right:20px;bottom:160px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:4px 4px 4px 16px;border-radius:12px;background:#25211F;color:#FFFFFF;font-size:12px"><span>{{notice}}</span><button type="button" onClick="{{clearNotice}}" aria-label="关闭提示" style="width:44px;height:44px;border:0;background:transparent;color:#FFFFFF;font-size:20px">×</button></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#E03131","options":["#E03131","#BD2424","#A82020"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tab:'overview',artistLiked:false,liked:[0,2],active:0,playing:false,query:'',sort:false,albumFilter:null,reverse:false,searchOpen:false,menu:null,queueOpen:false,nextTrack:null,notice:'' };
  renderVals() {

    const raw=[{title:'把悲伤留给自己',albumId:'runaway',seconds:271},{title:'风筝',albumId:'kite',seconds:283},{title:'牡丹亭外',albumId:'encounter',seconds:318},{title:'归乡',albumId:'home',seconds:319},{title:'20岁的眼泪',albumId:'kite',seconds:323},{title:'我喜欢私奔和我自己',albumId:'runaway',seconds:317}];
    const fmt=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');

    const all=raw.map((t,i)=>{const a=albums.find(a=>a.id===t.albumId),liked=s.liked.includes(i);return {...t,id:i,album:a.title,cover:a.cover,alt:a.title+'专辑封面',duration:fmt(t.seconds),background:i===s.active?'#FCF0EF':'transparent',color:i===s.active?'#C02626':'#111111',liked,likeColor:liked?'#C02626':'#76716F',likeFill:liked?'currentColor':'none',playAria:'播放'+t.title,likeAria:(liked?'取消喜欢':'喜欢')+t.title,moreAria:t.title+'的更多操作',menuOpen:s.menu===i,play:()=>this.setState({active:i,playing:true,queueOpen:false}),like:()=>this.setState({liked:liked?s.liked.filter(x=>x!==i):[...s.liked,i]}),more:()=>this.setState({menu:s.menu===i?null:i}),openAlbum:()=>openAlbum(t.albumId),playNext:()=>this.setState({nextTrack:i,menu:null,notice:'下一首将播放《'+t.title+'》'})};});
    let songs=all.filter(t=>(!s.albumFilter||t.albumId===s.albumFilter)&&t.title.includes(s.query.trim()));

    const filterAlbum=albums.find(a=>a.id===s.albumFilter);
    return {accent,albums:(s.reverse?[...albums].reverse():albums).map(a=>({...a,alt:a.title+'专辑封面',aria:'查看'+a.title+'中的歌曲',open:()=>openAlbum(a.id)})),songs,current:all[s.active],queueSongs:all,
      tabs:[{id:'overview',label:'概览'},{id:'songs',label:'歌曲  6'},{id:'albums',label:'专辑  4'}].map(t=>({...t,selected:s.tab===t.id,color:s.tab===t.id?'#C02626':'#645F5B',line:s.tab===t.id?accent:'transparent',weight:s.tab===t.id?650:450,pick:()=>this.setState({tab:t.id,albumFilter:null,query:'',searchOpen:false,menu:null})})),
      showAlbums:s.tab!=='songs',showSongs:s.tab!=='albums',songHeading:filterAlbum?filterAlbum.title:'歌曲',resultCount:songs.length+' 首',hasAlbumFilter:!!filterAlbum,noAlbumFilter:!filterAlbum,clearAlbum:()=>this.setState({albumFilter:null,query:''}),
